<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newport Haven Strata</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Bebas+Neue&family=Righteous&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1e1b4b 0%, #312e81 50%, #1a0a0a 100%);
      font-family: 'Righteous', sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(167,139,250,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(249,115,22,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 90%, rgba(220,38,38,0.15) 0%, transparent 50%);
      animation: bgShift 5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes bgShift {
      0%   { opacity: 0.4; transform: scale(1) rotate(0deg); }
      50%  { opacity: 1;   transform: scale(1.08) rotate(1deg); }
      100% { opacity: 0.6; transform: scale(0.97) rotate(-1deg); }
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 1rem;
      animation: fadeDown 1s ease-out forwards;
    }

    .unit-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4vw;
      letter-spacing: 0.6em;
      color: rgba(251,146,60,0.85);
      text-transform: uppercase;
      margin-bottom: 3vw;
      animation: fadeDown 1.2s ease-out forwards, unitPulse 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(251,146,60,0.5));
    }

    .unit-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 68vw;
      line-height: 0.82;
      background: linear-gradient(180deg,
        #e9d5ff 0%,
        #a78bfa 20%,
        #f97316 55%,
        #dc2626 78%,
        #7f1d1d 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 100% 300%;
      animation:
        numberEntry 1s cubic-bezier(0.34, 1.9, 0.64, 1) forwards,
        gradientFlow 2.5s ease-in-out infinite alternate,
        fireGlow 1.5s ease-in-out infinite alternate,
        numberPulse 3s ease-in-out infinite;
    }

    .week {
      margin-top: 1.5rem;
      font-family: 'Righteous', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      animation: fadeUp 1.6s ease-out forwards;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes numberEntry {
      from { opacity: 0; transform: scale(0.3) translateY(60px); filter: blur(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0);      filter: blur(0); }
    }

    @keyframes gradientFlow {
      0%   { background-position: 50% 0%; }
      100% { background-position: 50% 100%; }
    }

    @keyframes fireGlow {
      0% {
        filter:
          drop-shadow(0 0 30px rgba(167,139,250,0.7))
          drop-shadow(0 0 80px rgba(249,115,22,0.3));
      }
      100% {
        filter:
          drop-shadow(0 0 80px rgba(167,139,250,1))
          drop-shadow(0 0 140px rgba(249,115,22,0.9))
          drop-shadow(0 0 200px rgba(220,38,38,0.5));
      }
    }

    @keyframes numberPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes unitPulse {
      0%   { opacity: 0.6; letter-spacing: 0.5em; }
      100% { opacity: 1;   letter-spacing: 0.8em; }
    }
  </style>
</head>
<body>

  <div class="title">Newport Haven</div>
  <div class="unit-label">Unit</div>
  <div class="unit-number" id="unit-number">—</div>
  <div class="week" id="week"></div>

  <script>
    const ANCHOR_DATE = new Date(2026, 4, 17);
    const ANCHOR_UNIT = 5;
    const TOTAL_UNITS = 8;

    function getNextSunday(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      const day = d.getDay();
      d.setDate(d.getDate() + (day === 0 ? 0 : 7 - day));
      return d;
    }

    const today = new Date();
    const thisSunday = getNextSunday(today);

    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const weeksDiff = Math.round((thisSunday - ANCHOR_DATE) / msPerWeek);
    const unitNumber = ((ANCHOR_UNIT - 1 + weeksDiff) % TOTAL_UNITS + TOTAL_UNITS) % TOTAL_UNITS + 1;

    const monday = new Date(thisSunday);
    monday.setDate(monday.getDate() - 6);

    const fmt = d => d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });

    document.getElementById('unit-number').textContent = unitNumber;
    document.getElementById('week').textContent = fmt(monday) + ' – ' + fmt(thisSunday);
  </script>

</body>
</html>
